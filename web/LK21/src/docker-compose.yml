version: '3.8'

services:
  web:
    build: .
    ports:
      - "8001:80"
    environment:
      DB_HOST: db
      DB_NAME: movie_db
      DB_USER: user
      DB_PASS: password
    depends_on:
      - db

  db:
    image: mariadb:10.6
    restart: always
    environment:
      MYSQL_DATABASE: movie_db
      MYSQL_USER: user
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  db_data:


