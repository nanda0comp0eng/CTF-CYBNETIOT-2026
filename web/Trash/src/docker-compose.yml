version: '3.8'

services:
  archive-architect:
    build: .
    container_name: ctf_archive_architect
    ports:
      - "8002:5000"
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          memory: 128M
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp/workspaces:size=100M,mode=777,uid=1000

networks:
  default:
    name: ctf_network
