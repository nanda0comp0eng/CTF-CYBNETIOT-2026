<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DNS Lookup</title>

<style>
    body {
        background: #f4f6f8;
        font-family: "Segoe UI", Tahoma, sans-serif;
    }

    .container {
        width: 450px;
        margin: 80px auto;
        background: #ffffff;
        padding: 35px;
        border-radius: 10px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }

    h1 {
        text-align: center;
        margin-bottom: 10px;
        color: #2c3e50;
    }

    p {
        text-align: center;
        color: #666;
        margin-bottom: 30px;
    }

    label {
        display: block;
        margin-bottom: 6px;
        font-weight: 600;
        color: #333;
    }

    input {
        width: 100%;
        padding: 12px;
        margin-bottom: 18px;
        border-radius: 6px;
        border: 1px solid #ccc;
        font-size: 15px;
    }

    input:focus {
        outline: none;
        border-color: #2c3e50;
    }

    button {
        width: 100%;
        padding: 14px;
        background: #2c3e50;
        color: #fff;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }

    button:hover {
        background: #1f2f3d;
    }

    footer {
        text-align: center;
        margin-top: 20px;
        font-size: 13px;
        color: #999;
    }
</style>
</head>
<body>
<div class="container">
    <h1>Result</h1>
    <p>{{ result.stdout | safe }}</p>
</div>
</body>
</html>
